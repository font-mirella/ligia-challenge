# Publishes GitHub Pages: the event site (built from site/) under /site/, and a redirect at the root.
# convergechallenge.cin.ufpe.br is a CIn proxy that serves the /site/ path, so keep the site there.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the event site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir _site
          cp -r site/dist _site/site
          # The old institutional deck used to live at the root; send visitors to the official site.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="utf-8" />
              <title>Converge Challenge</title>
              <link rel="canonical" href="https://convergechallenge.cin.ufpe.br/" />
              <meta http-equiv="refresh" content="0; url=https://convergechallenge.cin.ufpe.br/" />
              <meta name="robots" content="noindex" />
            </head>
            <body>
              <p>O Converge Challenge está em <a href="https://convergechallenge.cin.ufpe.br/">convergechallenge.cin.ufpe.br</a>.</p>
            </body>
          </html>
          HTML

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}site/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
